# R341 bundled provider catalogue — ProviderRegistry source of truth.
#
# Schema: ProviderYaml (see ProviderRegistry.java)
#   - snake_case YAML keys; see ProviderSpec record for the Java side.
#   - type defaults to "openai-compat" if absent
#   - enabled defaults to true if absent
#   - apiKey is optional (env var path is the safer default)
#   - apiKeyEnv defaults to "API_KEY" if absent (almost never the right answer
#     in practice; set explicitly per provider)
#
# Override / merge order at daemon startup:
#   1. <userHome>/.aethercode/providers.yaml    (user override, full replace per name)
#   2. THIS FILE                                (bundled default, shipped in jar)
#   3. ProviderRegistry.bundledDefaults()       (Java fallback when THIS file is missing)
#
# To ADD a new provider, append an entry below. To HIDE a bundled
# provider, set `enabled: false` in a user-level override entry of
# the same name (full replace on name match).
#
# Numbers reflect publicly listed rates as of late 2025; see
# doc/user-guide/providers.md for the rationale behind each price
# and a per-brand recommendation.
#
# NOTE — two reader schemas in the repo:
#   This file uses the ProviderYaml schema (ProviderRegistry reads
#   it). The aethercode-models/resources/providers.yaml is a
#   separate resource read by ModelRegistryLoader for the
#   renderer's ModelCard / ModelPicker. They share the file name
#   only by coincidence of historical layering — a future round
#   should harmonise them. Until then, this file is the live
#   daemon-side catalogue and bundledDefaults() is the last-resort
#   fallback when this file is missing.

providers:
  - name: minmax
    type: openai-compat
    baseUrl: https://api.minimaxi.com/v1
    apiKeyEnv: MINIMAX_API_KEY
    defaultModel: MiniMax-M3
    models:
      - id: MiniMax-M3
        context: 1000000
        maxOutput: 512000
        inputPer1k: 0.001
        outputPer1k: 0.008
        default: true
      - id: MiniMax-Text-01
        context: 1000000
        maxOutput: 512000
        inputPer1k: 0.001
        outputPer1k: 0.008
      - id: MiniMax-M1
