[package]
name = "aethercode-desktop"
version = "0.2.28"
description = "AetherCode Desktop App"
authors = ["AetherCode"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aethercode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol` is REQUIRED for release builds. Without it,
# tauri-build sets `cargo:dev=true` (since it inverts the
# `custom-protocol` feature flag), and runtime `get_app_url()`
# falls into the `#[cfg(dev)]` branch — pointing the WebView at
# `devUrl` (http://localhost:1420/) instead of the bundled
# `frontendDist`. Result: every release exe shows the
# `localhost 拒绝连接 / ERR_CONNECTION_REFUSED` chrome-error page
# instead of the React renderer. Enabling the feature flips
# the cfg so `get_app_url()` returns the embedded asset URL
# (`http://tauri.localhost` on Windows).
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
tauri-plugin-dialog = "2"
# R287: spawn the daemon's `ssd --interactive`
# subprocess from the Settings panel. The shell
# plugin exposes a TypeScript `Command` class
# (`@tauri-apps/plugin-shell`) that handles the
# stdin/stdout pipes for newline-delimited JSON.
# Without this plugin the desktop SsdPanel
# renders a `MockSsdDriver` with canned events
# (the prior-round default); with it, the same
# panel drives a real SSD run from a JVM the user
# launched via the daemon's `ssd` CLI.
tauri-plugin-shell = "2"
# R249: HTTP client for the strategy-bank surface (R244.2
# endpoints). Symmetric with the TS BankClient shipped in
# aethercode-memory@0.1.0 (R244.3) — same URL/path/method
# wire format, same JSON shape, same 404 dual-semantics.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# R249: derive Error / Display for BankClientError without
# hand-rolling impl. Lightweight (~1 KB), used only in
# the bank_client module.
thiserror = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
