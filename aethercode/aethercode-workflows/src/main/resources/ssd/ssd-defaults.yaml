version: 1
name: ssd
description: |
  R236 — SSD (Spec-Design-Tasks-Dev) built-in workflow. 4 phases with
  per-phase human-in-the-loop confirmation:

    1. spec    →  .aethercode/ssd/<feature>/spec.md
    2. design  →  .aethercode/ssd/<feature>/design.md
    3. tasks   →  .aethercode/ssd/<feature>/tasks.md
    4. dev     →  .aethercode/ssd/<feature>/dev.log  (per-task LLM loop)

  This YAML is bundled inside `aethercode-workflows.jar` and loaded by
  `SsdConfig.fromBundled()`. Prompts are editable: drop a project-local
  copy at `<cwd>/.aethercode/ssd/ssd.yaml` and `SsdConfig.fromProject()`
  picks it up (the bundled version is the fallback).

  The runner concatenates the phase system prompt with a shared
  `[HARD RULES]` block to keep the model from:
    • calling tools (file_read, bash, ask_user_question) mid-phase
    • emitting <think>…</think> blocks
    • starting with chatty preambles ('Draft:', 'Note:', 'I will', …)
  That block was discovered during R235 and is the single most
  important reason the produced artefacts are clean.

# ---- per-phase prompt templates ---------------------------------------

phases:
  - id: spec
    order: 1
    file: spec.md
    title: "Spec"
    userPromptTemplate: |
      CONTEXT: This is the AetherCode project. The feature '{{feature}}' is
      being added to AetherCode itself. SSD here means
      Spec-Design-Tasks-Dev — a 4-phase spec-first development pipeline
      driven by the `aethercode ssd` command. The user wants the spec
      for the feature described in the `intent` field, not for any
      external project.

      feature = {{feature}}
      intent  = {{intent}}

      Phase 1 of 4: Generate the spec.md content. Required sections:
        1. Background — why this change is being made (2-4 sentences).
        2. Goals — bullet list of what success looks like.
        3. Non-goals — bullet list of what is explicitly out of scope.
        4. Functional requirements — FR-1, FR-2, ... each phrased as
           "as a <role>, I want <capability>, so that <value>".
        5. Non-functional requirements — NFR-1, NFR-2, ... for
           performance, security, observability, error handling.
        6. Open questions — anything you need clarified before design.

      Use this header order (the runner trims anything before the first
      H1, but starting with the right header avoids wasted tokens):

        # {{feature}} — Spec
        ## Background
        ## Goals
        ## Non-goals
        ## Functional Requirements
        ## Non-Functional Requirements
        ## Open Questions

      Return ONLY the markdown. No preamble, no closing line.
    userRevisionTemplate: |
      CONTEXT: This is the AetherCode project. The feature '{{feature}}' is
      being added to AetherCode itself.

      feature = {{feature}}
      intent  = {{intent}}

      spec.md (current draft):
      ```
      {{priorContent}}
      ```

      Apply these revisions and re-emit the full revised markdown
      (no preamble, same section headers, the whole document):

      {{revision}}
    systemPrompt: |
      You are running the SSD (Spec-Design-Tasks-Dev) workflow where
      SSD = a 4-phase spec-first development pipeline. Phase 1 of 4
      is `spec` — produce the requirements document.

      Number the FRs and NFRs (FR-1, FR-2, ...; NFR-1, NFR-2, ...).
      Each FR/NFR must be testable: "is requirement N satisfied?"
      should have an objective yes/no answer.
    maxTokens: 4096

  - id: design
    order: 2
    file: design.md
    title: "Design"
    userPromptTemplate: |
      feature = {{feature}}

      spec.md (already on disk):
      ```
      {{priorContent}}
      ```

      Phase 2 of 4: Generate the design.md content. Required sections:
        1. Architecture overview — one diagram (mermaid or ASCII).
        2. Module breakdown — every file/function added, modified, or
           removed; one-line summary each.
        3. Data model — interfaces, classes, schema migrations, wire
           formats; field-level types where not obvious.
        4. API surface — every new/changed RPC, CLI flag, or public
           method, with request/response shape.
        5. Failure modes & recovery — for each call, the error map and
           how the system recovers (or surfaces to the user).
        6. Test strategy — unit, E2E, manual; what each one proves.

      Reference the spec.md FR/NFR ids inline so reviewers can trace
      requirements to design.

      Use this header order:

        # {{feature}} — Design
        ## Architecture Overview
        ## Module Breakdown
        ## Data Model
        ## API Surface
        ## Failure Modes & Recovery
        ## Test Strategy

      Return ONLY the markdown. No preamble, no closing line.
    userRevisionTemplate: |
      feature = {{feature}}

      spec.md (current):
      ```
      {{specContent}}
      ```

      design.md (current draft):
      ```
      {{priorContent}}
      ```

      Apply these revisions and re-emit the full revised design.md
      markdown (no preamble, same section headers, the whole document):

      {{revision}}
    systemPrompt: |
      You are running the SSD workflow. Phase 2 of 4 is `design` —
      produce the technical design grounded in the prior `spec.md`.

      Reference the spec.md FR/NFR ids inline (FR-1, NFR-2, …).
    maxTokens: 6144

  - id: tasks
    order: 3
    file: tasks.md
    title: "Tasks"
    userPromptTemplate: |
      feature = {{feature}}

      spec.md:
      ```
      {{specContent}}
      ```

      design.md:
      ```
      {{priorContent}}
      ```

      Phase 3 of 4: Generate the tasks.md content. Multi-level
      decomposition:

        - Phase 1..N (Phase 1 = Spec, Phase 2 = Design are
          already done; only enumerate Phase 3 / "Tasks" and
          Phase 4 / "Dev").
        - Inside each phase, M Milestones (M-1, M-2, ...).
        - Inside each Milestone, K Tasks (T-N.M.K).
        - Each task: id, title, files (list of paths it touches),
          est_minutes (rough estimate), acceptance criteria
          (1-3 bullets, must be objectively checkable).
        - Each milestone: id, title, summary, dependency on
          prior milestone ids.
        - Each phase: id, title, summary, dependencies.

      Format as a markdown table per milestone. Reference the
      design.md file paths verbatim in the `Files` column. The task
      list must be sufficient that a competent engineer + AI pair
      can execute without re-reading the design.

      Return ONLY the markdown. No preamble, no closing line.
    userRevisionTemplate: |
      feature = {{feature}}

      spec.md:
      ```
      {{specContent}}
      ```

      design.md:
      ```
      {{designContent}}
      ```

      tasks.md (current draft):
      ```
      {{priorContent}}
      ```

      Apply these revisions and re-emit the full revised tasks.md
      markdown (no preamble, same table structure, the whole
      document):

      {{revision}}
    systemPrompt: |
      You are running the SSD workflow. Phase 3 of 4 is `tasks` —
      produce a multi-level task decomposition grounded in
      `spec.md` and `design.md`.

      Phases 1-2 (spec, design) are already done; do NOT list them
      again — start at Phase 3 (Tasks) and Phase 4 (Dev).
    maxTokens: 6144

  - id: dev
    order: 4
    file: dev.log
    title: "Dev"
    userPromptTemplate: |
      feature  = {{feature}}
      task     = {{taskId}} — {{taskTitle}}
      files    = {{taskFiles}}
      est_min  = {{taskEstMin}}
      acceptance = {{taskAcceptance}}

      cwd      = {{cwd}}

      Implement this task. When done, end with a single line:
      'TASK DONE'. Be specific about the exact files you wrote or
      modified and the test command you'd run.
    userRevisionTemplate: |
      feature  = {{feature}}
      task     = {{taskId}} — {{taskTitle}}

      (No revision path for phase 4 — re-run with --from-phase 4
      to re-implement the whole task list.)
    systemPrompt: |
      You are running the SSD workflow. Phase 4 of 4 is `dev` —
      implement the current task. The runner passes you the
      current task id + title + acceptance criteria; you return
      the exact file edits / shell calls needed to complete it,
      then end with a one-line `TASK DONE` marker on its own
      line. Do NOT touch files outside the task's `files` list.
    maxTokens: 8192

# ---- shared hard rules -----------------------------------------------
# Prepended to the user prompt of every phase. Critical for keeping the
# model's output clean (R235 discovered that without these, the model
# runs tools and produces 500KB+ of duplicated drafts).

hardRules: |
  [HARD RULES FOR THIS TURN]
    - Do NOT call any tools (no bash, no file_read, no glob, no grep, no ask_user_question).
    - Do NOT include <think>...</think> blocks.
    - Do NOT start with 'Draft:' / 'Note:' / 'I will' / 'Let me' / 'Sure,' / 'Okay,'.
    - Output ONLY the markdown content (start with the first `#` header).
    - Do NOT include a closing line ('Let me know if...' / 'Happy to help' / etc.).

# ---- per-call knobs --------------------------------------------------

maxWaitMs: 180000      # 3 minutes per LLM call; matches ssd.py deadline
idleEndMs: 2500        # extra idle time after run_end before we stop polling

# ---- artefact layout -------------------------------------------------

artefactRoot: ".aethercode/ssd"   # relative to cwd; the runner appends /<feature>

# ---- end -------------------------------------------------------------
